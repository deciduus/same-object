<title>Gradient Coupling Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{

  --hair:#dee3e9;
  --link:#a9b4c1;
  --bio:#1f6b52;
  --principle:#8a5a06;
  --finding:#1d4f7a;
  --spec:#a03c22;
  --gap:#7b2f6b;
  --exp:#2a6030;
  --closed:#6b7280;
  --shadow:0 1px 2px rgba(18,22,32,.07),0 10px 30px -14px rgba(18,22,32,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f14;
    --panel:#141922;
    --sunk:#1b212b;
    --ink:#e9edf3;
    --ink-2:#aab5c4;
    --ink-3:#788495;
    --rule:#2b3441;
    --hair:#222a35;
    --link:#3a4553;
    --bio:#5ec49f;
    --principle:#e0af52;
    --finding:#6cb0e6;
    --spec:#e88a6c;
    --gap:#d489c4;
    --exp:#79c47f;
    --closed:#8b95a3;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f14;--panel:#141922;--sunk:#1b212b;--ink:#e9edf3;--ink-2:#aab5c4;--ink-3:#788495;
  --rule:#2b3441;--hair:#222a35;--link:#3a4553;--bio:#5ec49f;--principle:#e0af52;--finding:#6cb0e6;
  --spec:#e88a6c;--gap:#d489c4;--exp:#79c47f;--closed:#8b95a3;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);margin:0;
  font-family:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}

header{
  padding:14px 20px;border-bottom:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;background:var(--panel);
  flex:none;
}
h1{
  font-family:"Familjen Grotesk",sans-serif;font-weight:700;font-size:19px;
  margin:0;letter-spacing:-.015em;white-space:nowrap;
}
.sub{font-family:"Roboto Mono",monospace;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.fchip{
  font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:11px;border:1px solid var(--rule);background:transparent;
  color:var(--ink-3);cursor:pointer;font-weight:500;
}
.fchip[aria-pressed="true"]{color:var(--panel);border-color:transparent}
.fchip.f-bio[aria-pressed="true"]{background:var(--bio)}
.fchip.f-principle[aria-pressed="true"]{background:var(--principle)}
.fchip.f-finding[aria-pressed="true"]{background:var(--finding)}
.fchip.f-spec[aria-pressed="true"]{background:var(--spec)}
.fchip.f-gap[aria-pressed="true"]{background:var(--gap)}
.fchip.f-exp[aria-pressed="true"]{background:var(--exp)}
.fchip.f-closed[aria-pressed="true"]{background:var(--closed)}
.fchip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;cursor:grab;min-width:0}
#stage.drag{cursor:grabbing}
#stage svg{display:block;width:100%;height:100%}
.bandlabel{
  font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;fill:var(--ink-3);
}
.bandrule{stroke:var(--hair);stroke-width:1}
.edge{fill:none;stroke:var(--link);stroke-width:1.2;opacity:.5}
.edge.hot{stroke-width:2.2;opacity:1}
.node{cursor:pointer}
.node circle{stroke:var(--panel);stroke-width:2.5;transition:r .12s}
.node:hover circle{stroke:var(--ink)}
.node.sel circle{stroke:var(--ink);stroke-width:3.5}
.node.dim{opacity:.16}
.nlabel{
  font-family:"Atkinson Hyperlegible",sans-serif;font-size:11.5px;fill:var(--ink-2);
  text-anchor:middle;pointer-events:none;
}
.node.sel .nlabel{fill:var(--ink);font-weight:700}

aside{
  width:400px;flex:none;border-left:1px solid var(--rule);background:var(--panel);
  overflow-y:auto;padding:22px 24px 40px;
}
@media(max-width:900px){
  main{flex-direction:column}
  aside{width:auto;border-left:none;border-top:1px solid var(--rule);max-height:46%}
  #stage{min-height:280px}
}
.badge{
  display:inline-block;font-family:"Roboto Mono",monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px;
  color:#fff;font-weight:500;margin:0 0 12px;
}
aside h2{
  font-family:"Familjen Grotesk",sans-serif;font-weight:600;font-size:21px;
  line-height:1.18;margin:0 0 12px;letter-spacing:-.012em;
}
aside p{margin:0 0 14px;font-size:14.5px;color:var(--ink-2)}
aside p.lead{color:var(--ink);font-size:15px}
aside strong{color:var(--ink);font-weight:700}
.kv{
  font-family:"Roboto Mono",monospace;font-size:12px;background:var(--sunk);
  padding:10px 12px;border-radius:3px;margin:0 0 14px;line-height:1.6;color:var(--ink);
}
.seclbl{
  font-family:"Roboto Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px;
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:12px;padding:4px 10px;border-radius:12px;background:var(--sunk);
  color:var(--ink-2);cursor:pointer;border:none;font-family:inherit;
}
.chip:hover{color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.srcs{font-size:13px;color:var(--ink-3);line-height:1.5}
.srcs div{margin:0 0 6px}

textarea{
  width:100%;min-height:88px;background:var(--sunk);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;padding:10px 12px;
  font-family:inherit;font-size:14px;resize:vertical;
}
textarea:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.noterow{display:flex;gap:8px;align-items:center;margin-top:8px}
button.save{
  font-family:"Roboto Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 14px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:var(--panel);
  cursor:pointer;font-weight:500;
}
button.save:disabled{opacity:.4;cursor:default}
button.save:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.notestate{font-family:"Roboto Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:14px}
.hint{
  font-family:"Roboto Mono",monospace;font-size:10px;color:var(--ink-3);
  letter-spacing:.05em;position:absolute;left:14px;bottom:12px;pointer-events:none;
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

             spec:"var(--spec)",gap:"var(--gap)",exp:"var(--exp)",closed:"var(--closed)"};

const N = [
// ---- biology ----
{id:"stat",t:"bio",l:"Statolith",h:"Dense starch grain as a gravity sensor",
 d:"A plant cell cannot feel its own weight — gravity loses to surface forces at that scale. So it grows a dense starch grain whose displacement costs only a few k<sub>B</sub>T, manufacturing a local contrast that survives the thermal floor.",
 k:"buoyant weight ≈ 10⁻¹⁴ N\ndisplacement ≈ 2–3 k_BT\n5–10 in a stack clears it",
 links:["m1","g4"],
 s:["Leitz et al., Plant Cell 21, 843 (2009)","Bérut et al., PNAS 115, 5123 (2018)"]},
{id:"fluid",t:"bio",l:"Fluidized pile",h:"Cellular noise makes the sensor work",
 d:"A dense granular pile should jam below a yield angle. Actomyosin agitation fluidizes it, so it flows at any inclination. Across 0.1g–3g the response depends only on <em>angle</em>, not force — the same at 2.5g as at 1g.",
 k:"an angle sensor, not a force sensor\nnoise linearizes a threshold device",
 links:["m2","g4"],
 s:["Chauvet et al., Sci. Rep. 6, 35431 (2016)","Bérut et al., PNAS 115, 5123 (2018)"]},
{id:"fern",t:"bio",l:"Fern catapult",h:"An escapement made of two timescales",

 k:"launch ≈ 6300 g\nspore speed ≈ 5 m/s\npowered by sunlight",
 links:["m3","m4"],
 s:["Noblin et al., Science 335, 1322 (2012)"]},
{id:"atp",t:"bio",l:"ATP cycle",h:"The carrier is a bus, not a tank",

 k:"pool ≈ 50 g free ATP\nturnover ≈ 60 kg/day\n~1000–1500 recycles/day/molecule",
 links:["f3","g3"],
 s:["Buono & Kolkhorst, Adv. Physiol. Educ. 25, 70 (2001)"]},
{id:"psii",t:"bio",l:"PSII repair line",h:"Cheap catalyst, continuous replacement",

 k:"D1 replaced ≈ every 30 min\nno engineered material has a repair cycle",
 links:["f4","g3"],
 s:["Cao, Cogdell et al., Sci. Adv. 6, eaaz4888 (2020)"]},
{id:"rp",t:"bio",l:"Radical pair",h:"Spin coherence in a warm protein",

 k:"needs ~1 µs coherence at 310 K\nfield energy ≈ 10⁻⁸ kT\nno knockout yet",
 links:["m1"],
 s:["Hore & Mouritsen, Annu. Rev. Biophys. 45, 299 (2016)","Xu et al., Nature 594, 535 (2021)"]},
{id:"vit",t:"bio",l:"Vitrification",h:"A global mobility switch",
 d:"Tardigrades and spores turn the cytoplasm into a glass at ~10¹² Pa·s, arresting every degradative reaction at once. Reversible because nothing was covalently changed — add water and it all restarts. Not one tall barrier: a switch on molecular motion itself.",
 k:"viscosity ≈ 10¹² Pa·s\nspore germination in minutes\nno ATP needed to start",
 links:["f2","m4"],
 s:["Boothby et al., Mol. Cell 65, 975 (2017)","Setlow, Microbiol. Spectr. (2014)"]},
{id:"lamsa",t:"bio",l:"LaMSA latch",h:"Slow load, fast release",
 d:"Muscle tops out near 500 W/kg. Decoupling loading from release beats it by orders of magnitude — trap-jaw ants reach ~10⁵ g. Springs and geometry are well modelled; the <em>latch</em> is explicitly the least-characterized element in the field.",
 k:"trap-jaw ant ≈ 10⁵ g\n64 m/s in 0.13 ms\nno cycles-to-failure number exists",
 links:["m3","g5"],
 s:["Ilton et al., Science 360, eaao1082 (2018)","Sutton et al., ICB 62, 1217 (2022)"]},

// ---- principles ----
{id:"m1",t:"principle",l:"Manufacture contrast",h:"Move 01",
 d:"When the signal sits under the noise floor, don't amplify it — create a local disparity that survives the floor. A plant grows a dense grain. LIGO squeezes the vacuum and relocates the noise rather than raising the signal.",
 k:"statoliths · squeezed light · magnetosomes",
 links:["f1"],s:[]},
{id:"m2",t:"principle",l:"Use the noise",h:"Move 02",
 d:"The engineering reflex is to suppress noise. Repeatedly wrong. Transport efficiency and detection thresholds are often non-monotonic in noise, with an optimum well above zero. Confirmed on three independent hardware platforms.",
 k:"ENAQT · granular fluidization · stochastic resonance",
 links:["f5"],s:["Maier et al., PRL 122, 050501 (2019)"]},
{id:"m3",t:"principle",l:"Separate timescales",h:"Move 03",
 d:"Don't build a faster actuator. Decouple slow loading from fast release and let an instability do the work. Below a critical mass, spring-driven beats motor-driven — and there is a published cascade of limits saying which component binds.",
 k:"latches · snap-buckling · cavitation catapults",
 links:["g5"],s:["Ilton et al., Science 360, eaao1082 (2018)"]},
{id:"m5",t:"principle",l:"Work inside the noise",h:"Move 05 · three postures",
 d:"Engineering's default is <strong>suppress</strong> — cryogenics, shielding, isolation, averaging. Biology repeatedly <strong>exploits</strong>: the statolith pile would jam if the cell were quiet, and quantum transport peaks at nonzero dephasing. And there is a third posture neither community claims: <strong>redistribute</strong> — LIGO squeezes the vacuum, moving uncertainty out of the quadrature it measures.<br><br>Honest correction: engineering does exploit noise, in dithering — deliberately adding noise to beat an ADC's resolution. It is standard practice and nobody calls it a principle.",
 k:"suppress · exploit · redistribute\neach community knows one\nstochastic resonance = the one that got unified",
 links:["fluid","f9"],
 s:["Gammaitoni, Hänggi, Jung & Marchesoni, Rev. Mod. Phys. 70, 223 (1998)"]},
{id:"m6",t:"principle",l:"Vary what was held fixed",h:"Move 06 · the neighbour procedure",
 d:"A hard bound is rarely wrong. What is usually wrong is the list of things its derivation held fixed <em>without saying so</em>.<br><br>Dysprosium-163 is <strong>stable</strong> as a neutral atom and has a 47-day half-life fully stripped. Nuclear stability was never wrong — the electron environment was a variable nobody varied. Solar neutrinos: the solar model was fine, <em>flavour</em> was the missing degree of freedom.<br><br><strong>Procedure:</strong> write down what the derivation <em>assumed</em>, not what it concluded. Ask which assumptions were varied experimentally and which were merely inherited. The unexamined ones are the work.",
 k:"applied to the 1/r⁷ wall:
· neutral matter — varied
· free space — varied
· ambient temperature — varied
· static in time — OPEN",
 links:["f16","f1"],s:[]},
{id:"m4",t:"principle",l:"Change the actor",h:"Move 04",
 d:"When a theorem or scaling law blocks the direct route, swap the <em>category</em> of the thing doing the work. A mirror can't move fast enough for dynamical Casimir — so make the boundary a boundary <em>condition</em> with no mass, and win by twelve orders of magnitude.",
 k:"circuit DCE · Floquet rotation · geometry as material",
 links:["g6","f7"],s:["Wilson et al., Nature 479, 376 (2011)"]},

// ---- findings ----
{id:"f1",t:"finding",l:"The 1/r⁷ wall",h:"Why no force field projects",
 d:"Neutral matter has no monopole coupling to any field. You must induce a dipole first, so force is second-order in the field. Combined with fields falling as 1/r³, force on neutral matter falls as <strong>1/r⁷</strong>. The 1400 T²/m that levitates matter at 3 cm becomes ~10⁻² T²/m at 3 m.",
 k:"F ∝ 1/r⁷\nshortfall ≈ 5 orders at 3 m\nradiation pressure capped at 3.3 nN/W",
 links:["s1"],s:["Berry & Geim, Eur. J. Phys. 18, 307 (1997)"]},
{id:"f2",t:"finding",l:"6 kJ/mol = 10× life",h:"Stability is cheap",
 d:"Lifetime goes as exp(ΔG‡/kT). At room temperature every ~6 kJ/mol of barrier buys a factor of ten in lifetime. One year needs ~100 kJ/mol; a <em>million</em> years needs ~135. Barrier grows logarithmically while energy density is unbounded — so the tradeoff people assume is much weaker than it feels.",
 k:"1 yr ≈ 100 kJ/mol\n10⁶ yr ≈ 135 kJ/mol\ndiamond: 2.9 driving vs 370–540 barrier",
 links:["g2","f6"],s:[]},
{id:"f3",t:"finding",l:"Separate carrier from machine",h:"The flow-battery move",
 d:"Flow batteries reach 10,000–27,000 cycles by circulating the energy-bearing fluid past fixed machinery serviced separately. That is the ATP architecture, arrived at independently with no reference to biology. It may matter more than reversibility itself.",
 k:"vanadium flow: 10,000–27,000 cycles\nLi-ion: 1,000–7,000\nquinone fade < 0.001%/cycle",
 links:["g3"],s:["Kwabi, Ji & Aziz, Chem. Rev. 120, 6467 (2020)"]},
{id:"f4",t:"finding",l:"Enzymes are consumed",h:"10³–10⁷ turnovers, then scrapped",
 d:"Catalysts are not immortal. Measured across ~180 metabolic enzymes: <strong>10³ to 10⁷ cycles</strong> until replacement, medians around 30–40 thousand. And the usual killer is mechanism-based inactivation — the enzyme is destroyed by the reaction it catalyzes.",
 k:"CCR range 10³–10⁷\nmedian ≈ 3–4 × 10⁴\nat 10⁶/s that is 10 seconds of work",
 links:["g3"],s:["Hanson et al., PNAS 118, e2023348118 (2021)"]},
{id:"f5",t:"finding",l:"Release control is the cost",h:"Storage was never the problem",
 d:"Two nuclear isomers hold 10⁴–10⁶× more energy than anything chemical and neither can be opened. Fat — at 37 MJ/kg, eight times TNT — is the best demonstrated room-temperature-stable, triggerable store there is. Biology got there first.",
 k:"Hf-178m2: 1.33 × 10⁶ MJ/kg, unopenable\nTa-180m: stable, no mechanism proposed\nfat: 37 MJ/kg, enzymatic",
 links:["g2","c5"],s:["Ahmad et al., PRL 87, 072503 (2001)"]},
{id:"f8",t:"finding",l:"Tantalum in your pocket",h:"A perfect battery you cannot discharge",
 d:"Isotopes cannot be separated in ordinary refining, so <strong>every piece of tantalum on Earth carries 0.012% Ta-180m</strong> — the rarest naturally occurring nuclide, and the most stable nuclear isomer known. It is in capacitors, implants and jewellery right now, holding energy nobody can reach. Note the chemical inertness that makes it safe in a body and its nuclear inaccessibility are unrelated facts that happen to coexist.",
 k:"100 mg capacitor → ~12 µg Ta-180m\n≈ 410 J stored\n≈ 4% of a AA battery, in micrograms\nstable > 10¹⁶ yr, no release mechanism",
 links:["f5"],s:[]},
{id:"f9",t:"finding",l:"Measure from inside",h:"Falloff, not sensitivity, is the wall",
 d:"A shark reads nanovolt-per-centimetre fields because it is <em>immersed in</em> the field, sampling across a ten-centimetre baseline of its own body in a conductive medium. It never fights distance. We measure brains through skulls and gravity across gaps, paying 1/r³ for a dipole field and 1/r⁷ for force on neutral matter.<br><br>Biology co-locates the sensor with the source. That is structural advantage, not cleverness — and it may explain more of the apparent gap than any design insight does.",
 k:"shark: in the field, 10 cm baseline\nMEG: through the skull\nwhen falloff-limited, get closer — not more sensitive",
 links:["f1"],s:[]},
{id:"f10",t:"finding",l:"Anomalies resolve to systematics",h:"The unwritten base rate",
 d:"Of the persistent inter-method discrepancies that have <em>resolved</em> — proton radius, ⁶Li, W boson mass, lepton universality, the kilogram — the record so far runs to systematics, not new physics. The 7σ proton radius was a correlated systematic in the older, more numerous method. A 3σ lepton-universality signal was <strong>particle misidentification</strong>.<br><br>Caveat that matters: the solar neutrino problem fit this exact pattern and <em>did</em> resolve to new physics. So the rate is not zero — it is uncomputed, and biased by looking only at recent cases.",
 k:"resolved recent cases → systematics\nsolar neutrinos → new physics\nnobody has computed the actual rate",
 links:["g10"],s:["Crivellin & Mellado, Nat. Rev. Phys. 6, 294 (2024)"]},
{id:"f11",t:"finding",l:"The anomaly was an input choice",h:"Muon g−2, autopsied",
 d:"The 5σ muon anomaly is <strong>gone</strong>. The 2025 theory update switched to lattice QCD and the residual fell to ~0.6σ — the central value moved purely from changing one input, and the uncertainty <em>grew</em>. Underneath, two pion datasets disagree with each other at 5σ. Use one and the Standard Model matches at 1σ; use the other and you get the anomaly back.<br><br>A decade of new-physics model-building rested on a choice of hadronic input.",
 k:"experiment: 124 ppb, settled\nWP20 → WP25 moved +223 × 10⁻¹¹\nCMD-3 vs KLOE: ~5σ",
 links:["g10"],s:["Aguillard et al., PRL (2025)","Aliberti et al., arXiv:2505.21476"]},
{id:"f12",t:"finding",l:"A theorem fixes the denominator",h:"How a gap actually closes",
 d:"The control case: <strong>work extracted per bit is NOT a gap.</strong> That metric is shared across colloidal, single-electron, cavity-QED and diamond platforms, which are directly comparable despite sharing no hardware.<br><br>Why? Sagawa and Ueda gave it a <em>theorem</em> rather than a convention. Fix the denominator and the shared figure of merit follows within a decade. <strong>Every other gap on this map is missing exactly that.</strong> Closing one does not need a review article — it needs a theorem.",
 k:"η = W / (k_BT · I), bounded by 1\nsingle-electron demon reaches ~75%\nthe one candidate that came back negative",
 links:["g13","g15"],
 s:["Sagawa & Ueda, PRL 104, 090602 (2010)","Parrondo, Horowitz & Sagawa, Nat. Phys. 11, 131 (2015)"]},
{id:"f13",t:"finding",l:"One theorem existed, one was unread",h:"And the difference is the lesson",
 d:"<strong>CORRECTED 2026-09-03.</strong> This node claimed both unifying results were sitting unread. <strong>One of them was not.</strong><br><br><strong>Gradient coupling — the claim was wrong.</strong> The 1965 'degree of coupling' is in <em>active use</em>. <em>Entropy</em> 25:1575 (2023) applies it to thermoelectric generators and oxidative phosphorylation in one framework, citing Kedem &amp; Caplan directly. arXiv:2403.20209 clones the form into a hydronic figure of merit and says so. Electrokinetic energy conversion has the same algebraic object, traced to Morrison &amp; Osterle <em>1965</em> — a parallel derivation in the same year.<br><br>The 'two co-citers' figure measured traffic between two named papers. It did not measure whether the <em>result</em> had travelled. It had. That is the counting failure in its purest form.<br><br><strong>Self-repair — this one held.</strong> Availability, MTBF/(MTBF+MTTR), is structurally identical to the photosynthetic repair steady state, and the biology side writes only a rate <em>inequality</em>, never the normalised fraction. Now computed, and generalised: <strong>Ha = k_r/k_d</strong>, with no prior art found.",
 k:"the 'unread theorem' pattern is half wrong\ncounting traffic ≠ counting travel\navailability ≡ PSII steady state — this half held",
 links:["g13","g15"],
 s:["Kedem & Caplan, Trans. Faraday Soc. 61, 1897 (1965)"]},
{id:"f14",t:"finding",l:"Synapse ≈ transistor",h:"Within a factor of 1.6 — and unremarked",
 d:"A mammalian cortical synapse spends <strong>1.99 fJ per bit</strong>. A 45 nm CMOS 32-bit integer add spends <strong>3.13 fJ per bit</strong>. Both sit near 10⁶ times the thermodynamic floor, across substrates separated by four billion years.<br><br>What makes it durable: the biggest uncertainty in brain energetics is the assumed firing rate, and it <em>does not propagate</em> — energy and transmitted bits both scale with release rate, so the ratio survives even where the budget percentages don't.<br><br>Correction carried: neurons are ~10⁶ above Landauer, not 10⁴. The 10⁴ is ATP <em>molecules</em>, and one ATP is ~20 kT.",
 k:"synapse: 24,000 ATP/bit → 6.9 × 10⁵\nCMOS 45 nm: 0.1 pJ / 32 bits → 1.09 × 10⁶\nratio 1.2–1.8 with ATP uncertainty",
 links:["g18"],
 s:["Harris, Jolivet & Attwell, Neuron 75, 762 (2012)","Horowitz, ISSCC 2014, Fig. 1.1.9"]},
{id:"f15",t:"finding",l:"Reliability doesn't explain it",h:"The obvious answer is off by 10⁴",
 d:"Being <em>right</em> costs energy — the bound is kT·ln(1/ε). At a demanding digital error rate of 10⁻¹⁵ that comes to <strong>34.5 kT, about 50× Landauer.</strong> The observed gap is 10⁶.<br><br><strong>Reliability accounts for under a third of it in log terms.</strong> The most-cited candidate explanation fails quantitatively, and as far as the survey found, nobody has said so.<br><br>What's left: finite-time cost, and the fact that both substrates move ~10³–10⁴ carriers across structures thousands of times larger than the bit. That would make the convergence architectural — both are wire-dominated — rather than a deep law.",
 k:"ε = 10⁻¹⁵ → ~50× Landauer\nobserved → ~10⁶×\nshortfall ≈ 4 orders",
 links:["g18"],
 s:["Riechers, Boyd, Wimsatt & Crutchfield, PRR 2, 033524 (2020)"]},
{id:"f16",t:"finding",l:"Stable is not intrinsic",h:"The constant survived; the neighbour was free",
 d:"Strip the electrons from dysprosium-163 and a <strong>stable</strong> nuclide acquires a 47-day half-life. Rhenium-187 goes from 42 billion years to 32.9. The emitted beta can land in a <em>bound</em> orbital of the daughter instead of the continuum, raising the effective decay energy about thirtyfold.<br><br>Nothing was added to the nucleus. A different door opened. ‘This nuclide is stable’ is a property of the nucleus <strong>plus its environment</strong>.<br><br>Honest limit: that is full ionization in a storage ring. Chemically accessible control tops out near 1%, and 10⁻⁴ for heavy nuclei.",
 k:"Dy-163: stable → 47 days
Re-187: 4.2 × 10¹⁰ yr → 32.9 yr
chemical route: ≤1.5%, best case",
 links:["m6"],
 s:["Jung et al., PRL 69, 2164 (1992)","Bosch et al., PRL 77, 5190 (1996)"]},
{id:"f6",t:"finding",l:"Manufacturing, not design",h:"What we consistently can't copy",
 d:"We reproduce nacre's brick-and-mortar geometry but not its self-assembly from seawater at room temperature. We've closed most of the molecular gap on spider silk — the bottleneck is the spinning duct, not the protein. The unmatched thing is almost always the process.",
 k:"nacre: architecture copied, assembly not\nsilk: protein solved, spinning not\nno engineered material self-repairs",
 links:["g3"],s:["Rising & Johansson, Nat. Chem. Biol. 11, 309 (2015)"]},
{id:"f7",t:"finding",l:"Electron shell as switch",h:"Soft triggers reach the nucleus",
 d:"Rhenium-187 goes from 42 billion years to <strong>32.9 years</strong> when fully stripped — a decay nearly forbidden by phase space becomes easy when the electron lands in a bound orbital. Dysprosium-163 goes from <em>stable</em> to a 47-day half-life the same way. Nothing was added; a door opened.",
 k:"Re-187: 4.2×10¹⁰ yr → 32.9 yr\nDy-163: stable → 47 days\nchemistry alone: only 0.1–1.5%",
 links:["c6"],s:["Bosch et al., PRL 77, 5190 (1996)","Jung et al., PRL 69, 2164 (1992)"]},

{id:"s1",t:"spec",l:"S1 · Matter exclusion",h:"THE OPEN ROW",
 d:"A region you cannot reach into, at standoff distance, in open air, at ambient temperature. <strong>No known mechanism does this.</strong> Everything with real stiffness needs a special material placed in the field — a superconductor, a strong diamagnet — so the exclusion is a property of the pairing, never of the field alone.",
 k:"flux pinning: 10–30 N/cm², cryogenic\ndiamagnetic: 1400 T²/m, in a bore\nacoustic: 5×10⁻³ N/cm², ≤ 4 mm objects",
 links:["e4"],s:["Berry & Geim (1997)","Hershcovitch, J. Appl. Phys. 78, 5283 (1995)"]},
{id:"s2",t:"spec",l:"S2 · Rotation switch",h:"Reduced — three mechanisms fit",
 d:"A ~20° turn gating the main effect. Multipole flux switch nulls at 90°/N — five pole pairs lands at 18°. A half-wave plate between crossed polarizers peaks at exactly 22.5°. Stoner–Wohlfarth gives a true latching step. Nested Halbach was the intuitive guess and is <em>wrong</em>: it varies as the half-angle.",
 k:"multipole: null at 90°/N\nhalf-wave plate: max at 22.5°\nHalbach: only 1.5% over 20°",
 links:["e5"],s:["Bjørk et al., JMMM 322, 3664 (2010)","Stoner & Wohlfarth (1948)"]},
{id:"s3",t:"spec",l:"S3 · Light bending",h:"Reduced — and unremarkable",
 d:"Plasma drives the refractive index <em>below</em> 1, so an overdense plasma is a <strong>diverging</strong> lens — the opposite of ordinary refraction. Fully ionized air perturbs light ~12× more strongly than air itself, with opposite sign. A visible free-floating distortion needs no exotic physics.",
 k:"ionized air: n ≈ 0.996\nthermal plume: Δn ≈ 4×10⁻⁴\nfilament core ≈ 100 µm",
 links:[],s:["Couairon & Mysyrowicz, Phys. Rep. 441, 47 (2007)"]},
{id:"s4",t:"spec",l:"S4 · Frequency cutoff",h:"Reduced — and yields a number",
 d:"Below the plasma frequency radio reflects; above it, radio passes. Sharp edge, set entirely by electron density. This is why shortwave bounces worldwide and FM goes to space, and why reentry blackout is beaten by moving <em>up</em> in band. The best row in the register: an anecdote becomes a measurement.",
 k:"f_p ≈ 9000 √n_e Hz\n90 MHz → 10⁸ cm⁻³\n9 GHz → 10¹² cm⁻³",
 links:["s5"],s:[]},
{id:"s5",t:"spec",l:"S5 · Nested geometry",h:"Weak — but fixes a scale",
 d:"A cone with a cap is a horn; a dome is a reflector or cavity. Weakly diagnostic on its own, but geometry fixes a length and a length predicts a band. That is arithmetic, not inference, and it gives a free internal-consistency check against any reported frequency.",
 k:"1 m dome → ~150 MHz\n0.25 m → ~600 MHz\n0.05 m → ~3 GHz",

{id:"g1",t:"gap",l:"Sub-38.6 µm gravity",h:"Never tested at its own strength",

{id:"g2",t:"gap",l:"No metastability metric",h:"Four literatures, no synthesis",

{id:"g3",t:"gap",l:"No cycle-life framework",h:"The metric nobody unifies",

{id:"g4",t:"gap",l:"Plant sensing limits",h:"The paper nobody wrote",

{id:"g5",t:"gap",l:"Latch cycles-to-failure",h:"Least-characterized element",

{id:"g6",t:"gap",l:"Measure negative energy",h:"Test a QEI experimentally",
 d:"Negative energy density is routinely made — that is what the Casimir effect is. Dynamical Casimir pulls real correlated photon pairs from vacuum. <strong>Nobody has done Wigner tomography on that output</strong> to reconstruct the local energy density and check it against a Ford–Roman bound. The hardware exists and works.",

 links:[],s:["Wilson et al., Nature 479, 376 (2011)","Fewster & Osterbrink, J. Phys. A 41 (2008)"]},
{id:"g7",t:"gap",l:"Weigh vacuum energy",h:"Does negative energy gravitate?",
 d:"Nobody has ever put negative energy on a scale. A cryogenic balance weighing a stack of Casimir cavities, modulating reflectivity through the superconducting transition, would test whether a localized <em>negative</em> energy density gravitates as general relativity demands. Under construction; no result.",

 links:[],s:[]},
{id:"g8",t:"gap",l:"Settle the Casimir puzzle",h:"A 20-year anomaly with a clean test",
 d:"Precision data fits the plasma model of metals and excludes the Drude model — which is the thermodynamically correct one. A 2025 proposal identifies transverse-electric evanescent waves as the culprit and proposes measuring the lateral magnetic field of an oscillating dipole near a metal surface. <strong>It has not been done.</strong>",
 k:"settles a Casimir dispute without a Casimir experiment\nalso firms up every sub-micron gravity limit",
 links:[],s:["Klimchitskaya & Mostepanenko, Universe 7, 84 (2021)"]},
{id:"g10",t:"gap",l:"Discrepancy base rate",h:"The cleanest opening found",
 d:"<strong>No cross-domain literature treats persistent inter-method discrepancy as a class.</strong> Metrology has 'dark uncertainty' — but it exists to produce a consensus value <em>despite</em> disagreement, absorbing it into an inflated error bar rather than asking whether the dispersion is signal. Philosophy has the sharpest statement of the hole: the standard defence is <em>robustness</em> — agreement across methods validates a result — and there is <strong>no corresponding account of what to do when they disagree.</strong><br><br>Nobody has built the catalogue, computed the base rate, or asked which features at time t predicted each outcome. No apparatus. All public data.",
 k:"candidate predictors:\n· methods measuring different quantities → interesting\n· single-group claims → resolve against\n· both sides improving, gap persists → unmodeled\n· forward model wrong > instrument wrong",
 links:["e6"],
 s:["Merkatas et al., Metrologia 56, 054001 (2019)","Stegenga, Phil. Sci. (2009)","Henrion & Fischhoff, Am. J. Phys. 54, 791 (1986)"]},
{id:"g11",t:"gap",l:"Neutron lifetime",h:"Survived its best explanation",
 d:"Bottle counts survivors — total disappearance. Beam counts decay protons — the β-channel only. So any channel producing no proton forces beam &gt; bottle. That asymmetry generated a real falsifiable particle hypothesis.<br><br>Two 2025 refinements make it <em>more</em> interesting: J-PARC ran a beam-family measurement counting <em>electrons</em> instead of protons and landed on the bottle value — so the problem is proton counting, not beams. And the leading concrete beam systematic was directly tested and <strong>rejected</strong>. Yet three independent lines still converge against the exotic reading.",
 k:"bottle: 877.83 ± 0.22 s (2025)\nbeam: 887.7 ± 2.2, frozen 13 yr\ngap ≈ 4.5σ, grew only as bottle improved",
 links:[],s:["Musedinovic et al., Phys. Rev. C 111, 045501 (2025)","Fuwa et al., arXiv:2412.19519"]},
{id:"g12",t:"gap",l:"Uncertainties are overconfident",h:"Forty years old, unfollowed",
 d:"A 1986 study examined the historical record of recommended values for fundamental constants and found that <strong>reported uncertainties systematically underestimate actual error</strong> — successive recommended values routinely fall outside the previous value's stated error bar. It connected this explicitly to the psychology of overconfidence.<br><br>Essentially never followed up. And the fine structure constant makes the point live: two atom-interferometry measurements, same class of technique, disagree at <strong>5.4σ</strong>. Far less famous than it deserves.",
 k:"α: 5.4σ between like methods\nG: ~13σ, unmoved across two CODATA cycles\nPDG scale factors may understate by 73% at n=4",
 links:["g10"],s:["Henrion & Fischhoff, Am. J. Phys. 54, 791 (1986)"]},
{id:"g13",t:"gap",l:"Gradient coupling FoM",h:"Zero citation contact",
 d:"Dynamic soaring, solar sails, electrodynamic tethers, thermoelectrics, osmotic power, evaporation engines and chemiosmosis all extract work by coupling to a pre-existing gradient. Thermoelectrics have a figure of merit. <strong>Nothing spans the class.</strong><br><br>Measured co-citation: dynamic soaring against osmotic power, solar sails, and thermoelectrics is <strong>zero in every pairing.</strong> Momentum/field-gradient coupling and chemical/thermal-gradient coupling are two literatures with literally no contact. Chemiosmosis sits on a third island.",
 k:"soaring ↔ everything: 0 papers\nthermoelectric ↔ osmotic: 2\nno power-per-unit-shear metric exists",
 links:["e7"],
 s:["Hermann, Energy 31, 1685 (2006)","Zhang et al., Nat. Nanotech. 13, 1109 (2018)"]},
{id:"g14",t:"gap",l:"Criticality as design",h:"Two reviews, disjoint bibliographies",
 d:"Hair cells self-tune to the edge of a Hopf bifurcation for divergent gain. So do parametric amplifiers, biased just below threshold. <strong>Same law, written twice, in two vocabularies.</strong><br><br><strong>CORRECTED 2026-09-03.</strong> This node previously claimed a 578-reference <em>Reviews of Modern Physics</em> colloquium on biological criticality cites zero engineering work. The bibliography was finally extracted: it has <strong>595 references</strong>, it carries <strong>no article titles at all</strong> — only venues — so the subject characterisation was reading data that is not there, and it contains <strong>five IEEE entries</strong>. Zero laser/MEMS/superconducting/photonic entries <em>by venue</em> is true. The review cites Stoop's Hopf-bifurcation theory papers and omits his cochlea <em>hardware</em>, which is stranger than a blanket absence.<br><br>Also refuted: <em>Sensors</em> 11:5808 asks the design question as one question. Engineering's name for the class is <strong>Lur'e systems</strong>.<br><br>What survives: only the missing <em>shared figure of merit</em> for distance from threshold. Cortex sits at m ≈ 0.98, amplifiers just below. Neither field has a number saying how far, comparable across the two.",
 k:"why cortex sits near m ≈ 0.98\nwhy an amp is biased just below\none question, asked twice",
 links:["e7"],
 s:["Camalet, Duke, Jülicher & Prost, PNAS 97, 3183 (2000)","Roy & Devoret, APL 107, 262601 (2015)"]},
{id:"g15",t:"gap",l:"No repair number",h:"Rate vs amplitude, never reconciled",
 d:"Biology quantifies repair as a <em>rate</em> — photosystem repair costs ~24,000 ATP per unit rebuilt, and a human turns over roughly 80 g of cells a day. Engineering quantifies healing as an <em>amplitude fraction</em> — about 75% toughness recovered.<br><br><strong>These are not commensurable: engineering's measure has no time in it.</strong> No dimensionless repair number exists. And conventional durability design is the same axis with the repair term silently set to zero.",
 k:"PSII: ~24,000 ATP per repair\nhuman turnover: 80 ± 20 g/day\nself-healing polymer: ~75% recovery, no rate\nKirkwood 1977 = the unread frame",
 links:["e7","f13"],
 s:["White et al., Nature 409, 794 (2001)","Yi et al., New Phytologist (2022)","Kirkwood, Nature 270, 301 (1977)"]},
{id:"g16",t:"gap",l:"Multifunctionality",h:"The math exists, in ecology",
 d:"Engineering has a narrow metric — sum of property ratios, multifunctional above 1. Structural batteries score about 0.25, below threshold, which is why it bites.<br><br>Ecology independently built a <strong>far more sophisticated N-function formalism</strong> giving an effective number of functions times average performance, with ~900 citations. <strong>Five co-citation queries between the two returned zero shared citing papers.</strong> The math engineering needs already exists, in a journal engineers do not read.",
 k:"ecology ↔ engineering: 0 shared citers\nstructural battery η ≈ 0.25\nengineering's version has no N-function form",
 links:["e7"],
 s:["Byrnes et al., Methods Ecol. Evol. 5, 111 (2014)","Snyder, Gienger & Wetzel (2015)"]},
{id:"g17",t:"gap",l:"How passive is it?",h:"Six names, no shared metric",
 d:"Passive dynamic walking, passive radiative cooling, morphological computation, compliant mechanisms — six domain-local names for letting physics do the control, no shared name, no portable metric.<br><br><strong>The best-kept find in the survey:</strong> a 1991 IAEA document already defines an ordinal passivity ladder — Category A (no signal inputs, no external power, no moving parts, no moving fluid) through D (passive execution, active initiation). Invisible outside nuclear engineering. Generalized it gives a real metric: <em>the fraction of the response that survives when you cut the actuation path.</em>",
 k:"walking robot c_et = 0.2 = human; ASIMO 3.2\nradiative cooling: 4.9 °C below ambient in sun\nhazard: control-theory 'passivity' is a homonym",
 links:["e7"],
 s:["Collins, Ruina, Tedrake & Wisse, Science 307, 1082 (2005)","IAEA-TECDOC-626 (1991)"]},
{id:"g18",t:"gap",l:"Energy per bit, one axis",h:"Four fields, four unit systems",
 d:"Neuroscience counts <strong>ATP molecules per bit</strong>. Chip design counts <strong>femtojoules per operation</strong>. Biophysics counts <strong>kT per methylation cycle</strong>. Superconducting logic counts <strong>zeptojoules per gate at 4 K</strong>. Nobody normalizes to kT, and the citation networks barely touch.<br><br>The closest published attempt covers molecular biology and supercomputers only — <em>no neurons, no reversible logic, no neuromorphic.</em> The definitive theory review supplies the machinery and no numbers.<br><br>The data splits into two clusters with a four-order void: near-Landauer systems are single-molecule, slow and local; far systems are fast and move charge across structures far larger than the bit. <strong>Neurons are in the far cluster.</strong> The brain's advantage is architectural, not thermodynamic.",
 k:"near (10¹–10³×): ATP 17, methylation 42, AQFP ~3.5\nfar (10⁶–10¹⁰×): synapse, CMOS, neuromorphic\nTrueNorth: 26 pJ/event → 9.1 × 10⁹",
 links:["e7"],
 s:["Kempes, Wolpert, Cohen & Pérez-Mercader, Phil. Trans. R. Soc. A 375 (2017)","Wolpert, J. Phys. A 52, 193001 (2019)"]},
{id:"g19",t:"gap",l:"Peak vs average",h:"Zero, against a 159-work control",
 d:"Engineering measures <strong>capacity factor, turndown ratio, part-load efficiency</strong>. Physiology measures <strong>factorial aerobic scope</strong> — max over basal. Same ratio, two vocabularies.<br><br>True co-citation between the metabolic-scope and peak-to-average-power literatures: <strong>zero</strong>, twice. The internal biology control returns <strong>159</strong> works — so this is an empty crossing, not sparse data.<br><br>Sharper still: biology already uses the words 'peak-to-average' and 'capacity factor', in its own sense, with no awareness of the engineering literature using them.<br><br>Neither side has the other's axis. Engineering lacks duration-dependence; physiology lacks the efficiency penalty. <strong>Nobody has written efficiency as a joint function of load fraction and duration.</strong>",
 k:"gas peaker: 13.9% capacity factor\naverage car driven ~4% of the time\nhumans: ~2.5× basal, sustained indefinitely",
 links:["g20","e7"],
 s:["Hammond & Diamond, Nature 386, 457 (1997)","EIA Electric Power Annual, Table 4.08.A"]},
{id:"g20",t:"gap",l:"Safety factor, derived twice",h:"The cleanest unread theorem",
 d:"Alexander's <em>Theory of Mixed Chains Applied to Safety Factors in Biological Systems</em> (1997) asks how much excess capacity a series system needs when its links vary. <strong>46 citations — all of them comparative biomechanics.</strong> Alligator limb bones, crab claw cuticle, intestinal lactase.<br><br>Engineering has had <strong>stress–strength interference theory since 1967 — 753 works.</strong> Load distribution, strength distribution, probability of interference in a weakest-link series system. <strong>The same object.</strong> Alexander appears to have derived it from scratch, thirty years late. Zero crossings either way.<br><br>The trade runs both directions: engineering offers biology a <em>probabilistic</em> safety factor — exactly the objection raised against symmorphosis since 1987. Biology offers engineering the duration axis and the <em>remodeling option</em>, a link that thickens under load. Stress–strength interference has no such thing; its strengths are fixed at manufacture.",
 k:"Alexander 1997: 46 cites, 0 engineering\nstress–strength: 753 works, 0 biological\n30-year head start, unread",
 links:["f13"],
 s:["Alexander, J. Theor. Biol. (1997)","Garland & Huey (1987) — the symmorphosis critique"]},
{id:"g9",t:"gap",l:"Classical-gravity noise floor",h:"Highest expected value",

{id:"e4",t:"exp",l:"Four-probe material test",h:"Separates every exclusion candidate",

{id:"e6",t:"exp",l:"Compute the base rate",h:"No apparatus · all public data",
 d:"Build the cross-domain catalogue of persistent inter-method discrepancies — G, α, neutron lifetime, proton radius, g−2, H₀, S₈, lithium, W mass, R_K, the kilogram. Tabulate outcomes. Compute what fraction resolved to systematics versus new physics. Then test which features, <em>at the time</em>, predicted each outcome.<br><br>Four candidate predictors already have empirical support. The strongest: <strong>when two implementations of the same method disagree, it is a systematic essentially always</strong> — caesium vs rubidium recoil at 5.4σ, the two HUST gravity methods at 2.7σ in one lab with one team.",
 k:"every input public\nnobody is doing it\nfirst paper of its kind",

{id:"e7",t:"exp",l:"Co-citation audit",h:"Publishable as-is · database query only",
 d:"The method that turned this project's hunches into measurements. Take two literatures that describe the same move, query how many papers cite both, and report the number. Zero is a finding.<br><br><strong>Two</strong> of these are publishable with nothing but the queries: the <strong>gradient-harvesting zero table</strong> and the <strong>multifunctionality zero table</strong>. No apparatus, no funding, no access barrier.<br><br><strong>CORRECTED 2026-09-03.</strong> A third — the criticality reference audit — was listed here and is <strong>withdrawn</strong>. Its reference count was wrong and the bibliography it characterised has no article titles in it. The unverified figure had reached five files before anyone opened the source. Reference-list audits now carry a precondition: fetch the list itself, check which fields it actually contains, and state which field you classified on.<br><br>Also learned: a blocked API is not a blocked method. When OpenAlex and Semantic Scholar rate-limited, <strong>Crossref, OpenCitations and Europe PMC</strong> all answered the same questions.",
 k:"turns 'I think there's a gap' into 'here is the zero'\nthree tables ready now\nrun on any bibliographic database",
 links:[],s:[]},

// ---------- layout ----------
const W = 1680, PAD = 130;
const byBand = {};
BANDS.forEach(b=>byBand[b.id]=[]);
N.forEach(n=>byBand[n.t].push(n));
BANDS.forEach(b=>{
  const row = byBand[b.id], n = row.length;
  const span = W - PAD*2;
  row.forEach((node,i)=>{
    node.x = n===1 ? W/2 : PAD + span*(i/(n-1));
    node.y = b.y;
  });
});
const MAP = {}; N.forEach(n=>MAP[n.id]=n);
const EDGES = [];
N.forEach(n=>(n.links||[]).forEach(t=>{ if(MAP[t]) EDGES.push([n.id,t]); }));

const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const H = BANDS[BANDS.length-1].y + 120;
let view = {x:0,y:-30,k:1};
svg.setAttribute("viewBox",`0 0 ${W} 800`);

const gRoot = document.createElementNS(NS,"g");
svg.appendChild(gRoot);
const gBand = document.createElementNS(NS,"g"); gRoot.appendChild(gBand);
const gEdge = document.createElementNS(NS,"g"); gRoot.appendChild(gEdge);
const gNode = document.createElementNS(NS,"g"); gRoot.appendChild(gNode);

BANDS.forEach(b=>{
  const ln = document.createElementNS(NS,"line");
  ln.setAttribute("x1",40); ln.setAttribute("x2",W-40);
  ln.setAttribute("y1",b.y-58); ln.setAttribute("y2",b.y-58);
  ln.setAttribute("class","bandrule"); gBand.appendChild(ln);
  const tx = document.createElementNS(NS,"text");
  tx.setAttribute("x",44); tx.setAttribute("y",b.y-66);
  tx.setAttribute("class","bandlabel"); tx.textContent = b.label;
  gBand.appendChild(tx);
});

const edgeEls = EDGES.map(([a,b])=>{
  const A=MAP[a], B=MAP[b];
  const p = document.createElementNS(NS,"path");
  const my = (A.y+B.y)/2;
  p.setAttribute("d",`M${A.x},${A.y} C${A.x},${my} ${B.x},${my} ${B.x},${B.y}`);
  p.setAttribute("class","edge");
  gEdge.appendChild(p);
  return {a,b,el:p};
});

const nodeEls = {};
N.forEach(n=>{
  const g = document.createElementNS(NS,"g");
  g.setAttribute("class","node");
  g.setAttribute("transform",`translate(${n.x},${n.y})`);
  g.setAttribute("tabindex","0");
  g.setAttribute("role","button");
  g.setAttribute("aria-label",n.l);
  const c = document.createElementNS(NS,"circle");
  c.setAttribute("r", n.t==="principle" ? 15 : 10);
  c.setAttribute("fill", CLR[n.t]);
  g.appendChild(c);
  const t = document.createElementNS(NS,"text");
  t.setAttribute("class","nlabel");
  t.setAttribute("y", (n.t==="principle"?15:10) + 17);
  t.textContent = n.l;
  g.appendChild(t);
  g.addEventListener("click",()=>select(n.id));
  g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();select(n.id);} });
  gNode.appendChild(g);
  nodeEls[n.id]=g;
});

// ---------- filters ----------
const active = new Set(BANDS.map(b=>b.id));
const fwrap = document.getElementById("filters");
BANDS.forEach(b=>{
  const btn=document.createElement("button");
  btn.className=`fchip f-${b.id}`;
  btn.setAttribute("aria-pressed","true");
  btn.textContent=b.label;
  btn.addEventListener("click",()=>{
    if(active.has(b.id)) active.delete(b.id); else active.add(b.id);
    btn.setAttribute("aria-pressed", active.has(b.id)?"true":"false");
    applyFilter();
  });
  fwrap.appendChild(btn);
});
function applyFilter(){
  N.forEach(n=>nodeEls[n.id].classList.toggle("dim", !active.has(n.t)));
  edgeEls.forEach(e=>{
    const on = active.has(MAP[e.a].t) && active.has(MAP[e.b].t);
    e.el.style.opacity = on ? "" : "0.05";
  });
}

// ---------- pan / zoom ----------
const stage = document.getElementById("stage");
function apply(){ gRoot.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`); }
let drag=null;
stage.addEventListener("pointerdown",e=>{
  if(e.target.closest(".node")) return;
  drag={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y};
  stage.classList.add("drag"); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove",e=>{
  if(!drag) return;
  const s = W / stage.clientWidth;
  view.x = drag.ox + (e.clientX-drag.x)*s;
  view.y = drag.oy + (e.clientY-drag.y)*s;
  apply();
});
stage.addEventListener("pointerup",e=>{drag=null;stage.classList.remove("drag");});
stage.addEventListener("pointercancel",()=>{drag=null;stage.classList.remove("drag");});
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  const f = e.deltaY<0 ? 1.12 : 1/1.12;
  const nk = Math.min(3, Math.max(0.35, view.k*f));
  view.k = nk; apply();
},{passive:false});

// ---------- panel ----------
const panel = document.getElementById("panel");
let sel = null, dbRef = null, notes = {};

function select(id){
  if(sel) nodeEls[sel].classList.remove("sel");
  sel = id; nodeEls[id].classList.add("sel");
  edgeEls.forEach(e=>e.el.classList.toggle("hot", e.a===id||e.b===id));
  render();
}
function neighbours(id){
  const out=new Set();
  EDGES.forEach(([a,b])=>{ if(a===id)out.add(b); if(b===id)out.add(a); });
  return [...out];
}
function render(){
  const n = MAP[sel];
  if(!n){ panel.innerHTML = `<p class="empty">Select a node to read it. Bands run top to bottom: what biology does, the four moves drawn from it, the findings, the register specs, the open gaps, the experiments, and what is closed.</p>`; return; }
  const nb = neighbours(sel);
  panel.innerHTML = `
    <span class="badge" style="background:${CLR[n.t]}">${BANDS.find(b=>b.id===n.t).label}</span>
    <h2>${n.l}</h2>
    <p class="lead">${n.h}</p>
    <p>${n.d}</p>
    ${n.k?`<div class="kv">${n.k.replace(/\n/g,"<br>")}</div>`:""}
    ${nb.length?`<p class="seclbl">Connected</p><div class="chips">${nb.map(x=>`<button class="chip" data-go="${x}">${MAP[x].l}</button>`).join("")}</div>`:""}
    ${n.s&&n.s.length?`<p class="seclbl">Sources</p><div class="srcs">${n.s.map(x=>`<div>${x}</div>`).join("")}</div>`:""}
    <p class="seclbl">Your notes</p>
    <textarea id="note" placeholder="${dbRef?"Notes save and persist across sessions.":"Notes are local to this view."}">${(notes[sel]||"").replace(/</g,"&lt;")}</textarea>
    <div class="noterow">
      <button class="save" id="savebtn">Save note</button>
      <span class="notestate" id="nstate"></span>
    </div>`;
  panel.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.go)));
  const ta = panel.querySelector("#note"), btn = panel.querySelector("#savebtn"), st = panel.querySelector("#nstate");
  btn.addEventListener("click", async ()=>{
    const val = ta.value;
    notes[sel] = val;
    btn.disabled = true; st.textContent = "saving…";
    if(dbRef){
      try{ await dbRef.doc(`notes/${sel}`).set({text:val, updatedAt:Date.now()}); st.textContent="saved"; }
      catch(err){ st.textContent="save failed"; }
    } else { st.textContent = "saved in this view only"; }
    btn.disabled = false;
    setTimeout(()=>{ if(st) st.textContent=""; }, 2600);
  });
}
render();
select("m1");

// ---------- persistence ----------
(async ()=>{
  const db = await claude.use("db");
  if(!db) return;
  dbRef = db;
  try{
    const snap = await db.collection("notes").get();
    (snap||[]).forEach(doc=>{
      const id = (doc.id||"").split("/").pop();
      if(doc.data && doc.data.text) notes[id] = doc.data.text;
    });
    render();
  }catch(e){ /* render without stored notes */ }
})();
</script>
